name: Build D50 NSS image

on:
  push:
    branches: [ci]
  workflow_dispatch:

jobs:
  build:
    # Same image either way; the arm64 job's Image Builder runs on an aarch64 host.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          multilib=; [ "${{ matrix.arch }}" = x86_64 ] && multilib="gcc-multilib g++-multilib"
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk $multilib \
            gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget ccache zstd

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Build
        run: repo/ci/build.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Verify
        run: repo/ci/verify.sh "$GITHUB_WORKSPACE/openwrt" "$RUNNER_TEMP/verify"

      - name: Collect release files
        run: |
          B=openwrt/bin/targets/qualcommax/ipq50xx
          mkdir out
          cp $B/*xunison_exigo-hub-d50-5g*sysupgrade.bin $B/*xunison_exigo-hub-d50-5g*factory.img \
             $B/openwrt-imagebuilder-*.tar.zst $B/config.buildinfo $B/feeds.buildinfo $B/version.buildinfo out/
          cp "$RUNNER_TEMP/verify/image/packages.txt" out/image-packages.txt
          (cd out && sha256sum *.bin *.img *.tar.zst > sha256sums)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: d50-nss-${{ matrix.arch }}-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d50-nss-logs-${{ matrix.arch }}-${{ github.sha }}
          path: openwrt/logs/
          retention-days: 14
