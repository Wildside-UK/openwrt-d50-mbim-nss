name: Build D50 NSS image

on:
  push:
    branches: [ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget ccache zstd

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Build
        run: repo/ci/build.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Verify
        run: repo/ci/verify.sh "$GITHUB_WORKSPACE/openwrt" "$RUNNER_TEMP/verify"

      - name: Collect release files
        run: |
          B=openwrt/bin/targets/qualcommax/ipq50xx
          mkdir out
          cp $B/*xunison_exigo-hub-d50-5g*sysupgrade.bin $B/*xunison_exigo-hub-d50-5g*factory.img \
             $B/openwrt-imagebuilder-*.tar.zst $B/config.buildinfo $B/feeds.buildinfo $B/version.buildinfo out/
          cp "$RUNNER_TEMP/verify/image/packages.txt" out/image-packages.txt
          (cd out && sha256sum *.bin *.img *.tar.zst > sha256sums)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: d50-nss-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d50-nss-logs-${{ github.sha }}
          path: openwrt/logs/
          retention-days: 14
