# Settings for /usr/sbin/conwatch.sh. Restart after editing:
#   /etc/init.d/conwatch restart
# DRY_RUN=1 logs what it would do (logread -e conwatch) and acts on nothing.
DRY_RUN=0
# The modem interface in /etc/config/network. Nothing happens until it exists.
IFACE=wwan
TARGETS="9.9.9.9 149.112.112.11 1.1.1.1"
INTERVAL=30
FAILS_BEFORE_ACT=4
GRACE=300
IFUP_TRIES=2
IFUP_WAIT=120
REBOOT_GAP=1800
REBOOT_MAX=3
HEALTHY_RESET=21600
IFUP_RETRY=600
